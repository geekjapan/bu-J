[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-browser"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
web = ["websocket-client>=1.8,<2", "httpx[http2]>=0.28,<1"]

[project.scripts]
decision-browser = "decision_browser.cli:main"
decision-browser-web = "decision_browser.web.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
