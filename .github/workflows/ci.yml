name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANONYMIZED_TELEMETRY: 'false'
      BROWSER_USE_CLOUD_SYNC: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.6'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra web --extra generic
      - name: Run unit and CLI tests
        run: uv run --no-sync pytest -q
      - name: Check formal verification source tracking
        run: uv run --no-sync python -m unittest discover -s verification/formal -p 'test_*.py'
      - name: Build wheel
        run: uv build --wheel
