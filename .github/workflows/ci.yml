name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.12 tests and build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ANONYMIZED_TELEMETRY: 'false'
      BROWSER_USE_CLOUD_SYNC: 'false'
      PYTHONUTF8: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.6'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra web --extra generic
      - name: Run unit and CLI tests
        run: uv run --no-sync python scripts/verify.py
      - name: Check formal verification source tracking
        run: uv run --no-sync python -m unittest discover -s verification/formal -p 'test_*.py'
      - name: Build wheel
        run: uv build --wheel
      - name: Exercise Windows Chrome
        if: runner.os == 'Windows'
        run: uv run --no-sync python -m verification.windows_browser --output "${{ runner.temp }}/bu-j-browser"
      - name: Retain Windows browser evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-browser-evidence
          path: ${{ runner.temp }}/bu-j-browser
          retention-days: 7
